<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영상놀, 촬영 노하우와 프로세스</title>
<meta name="description" content="영상놀 동아리 초보자를 위한 촬영과 연출 가이드. 프리 프로덕션, 프로덕션, 포스트 프로덕션 순서로 스크롤하며 배웁니다.">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:title" content="영상놀, 촬영 노하우와 프로세스">
<meta property="og:description" content="찍기 전에, 찍는 동안, 찍고 난 뒤까지.">

<!-- 스크립트가 켜져 있을 때만 등장 효과용 숨김 상태를 적용 -->
<script>document.documentElement.classList.add('js');</script>

<!-- 폰트: Sofia Sans Extra Condensed(제목) / Barlow(본문) / Pretendard(한글) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@200;400&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>
<a class="skip" href="#intro">본문으로 건너뛰기</a>

<!-- 배경 장식: 아주 흐린 큰 로고 -->
<img class="bg-mark" src="assets/logo.png" alt="" aria-hidden="true" width="1000" height="1000">

<!-- 상단 진행선과 현재 위치의 타임코드 (보조 정보라 스크린리더에서는 숨김) -->
<div class="hud" aria-hidden="true">
  <div class="hud__bar"><i id="progress"></i></div>
  <div class="hud__tc"><span id="hudScene">처음</span><b id="hudTc">00:00:00:00</b></div>
</div>

<!-- 목차: 데스크톱은 좌측 고정, 모바일은 상단 가로 바 (내용은 script.js의 CONTENT.toc) -->
<nav class="toc" id="toc" aria-label="목차">
  <a class="toc__brand" href="#hero">영상놀</a>
  <ol id="tocList"></ol>
  <p class="toc__foot" id="tocFoot"></p>
</nav>

<main id="main">

  <!-- 히어로: 큰 제목과 영상놀 로고 -->
  <header class="hero" id="hero" data-scene="처음">
    <div class="hero__bg">
      <div data-slot="hero">
        <img src="assets/hero.jpg" width="2000" height="1031" fetchpriority="high"
             alt="카메라 뷰파인더 화면. 녹화 표시와 초점 박스가 보이는 밝은 촬영 스튜디오">
      </div>
    </div>
    <div class="hero__scrim"></div>
    <div class="hero__shade" id="heroShade"></div>
    <span class="hero__top wordmark" id="heroMark"></span>
    <div class="hero__inner">
      <img class="hero__logo" id="heroLogo" src="assets/logo.png" width="1000" height="1000" fetchpriority="high" alt="영상놀 로고. 글자로 이루어진 호랑이 얼굴">
      <h1 id="heroTitle"></h1>
      <div class="hero__aside">
        <p id="heroSentence"></p>
        <div class="hero__actions" id="heroActions"></div>
      </div>
    </div>
  </header>

  <!-- 소개 -->
  <section class="offset block" id="intro" data-scene="소개" aria-labelledby="introStatement">
    <div class="container">
      <div class="cols">
        <h2 class="statement ko" id="introStatement" data-reveal></h2>
        <div class="intro__rest" id="introRest"></div>
      </div>
    </div>
  </section>

  <!-- 01 프리 프로덕션 -->
  <section class="offset scene" id="pre" data-scene="프리 프로덕션" aria-labelledby="preTitle">
    <div class="chapter" data-chapter="pre"><div class="chapter__stage"><div class="chapter__inner"></div></div></div>
    <div class="container block">
      <div class="head" id="preHead"></div>
      <div id="crew" data-scene="프리 프로덕션, 팀별 준비"><div class="sheet" id="preCards" style="--n:3"></div></div>
      <div class="doc doc--nested" data-doc="location"></div>
      <div class="doc doc--nested" data-doc="gearTest"></div>
      <div class="doc doc--nested" data-doc="directorDocs"></div>
      <div class="doc doc--nested" data-doc="kit"></div>
    </div>
  </section>

  <!-- 02 프로덕션 -->
  <section class="offset scene" id="prod" data-scene="프로덕션" aria-labelledby="prodTitle">
    <div class="chapter" data-chapter="prod"><div class="chapter__stage"><div class="chapter__inner"></div></div></div>
    <div class="container block" style="padding-bottom: var(--section-gap-s)">
      <div class="head" id="prodHead" style="margin-bottom: 0"></div>
    </div>

    <!-- 현장 하루 타임라인: 스크롤하면 가로로 흘러가며 고정(pin) -->
    <div class="hscroll" id="timeline" data-scene="프로덕션, 현장 하루">
      <div class="hscroll__wrap">
        <div class="hscroll__head" id="dayHead"></div>
        <div class="hscroll__track" id="dayTrack" role="list"></div>
      </div>
    </div>

    <div class="doc" data-doc="basics"></div>
    <div class="doc" data-doc="sensor"></div>

    <!-- 노출 -->
    <div class="well grained sub" id="exposure" data-scene="프로덕션, 노출">
      <div class="container">
        <div class="head" id="expHead"></div>
        <div class="demo">
          <div class="scopes">
            <figure class="screen" style="margin:0">
              <span class="screen__tag" id="expTag">적정</span>
              <canvas id="expCanvas" width="320" height="180" role="img" aria-label="노출 슬라이더에 따라 밝기가 바뀌는 샘플 장면. 창가에 앉은 인물."></canvas>
            </figure>
            <figure class="wave" style="margin:0">
              <figcaption>웨이브폼</figcaption>
              <canvas id="waveCanvas" width="320" height="150" role="img" aria-label="현재 샘플 장면의 웨이브폼 그래프"></canvas>
            </figure>
          </div>
          <div class="controls">
            <div class="ctl"><div class="ctl__row"><label for="ctlAp">조리개</label><output id="outAp" for="ctlAp">f/2.8</output></div><input id="ctlAp" type="range" min="0" max="7" step="1" value="2"></div>
            <div class="ctl"><div class="ctl__row"><label for="ctlIso">ISO</label><output id="outIso" for="ctlIso">800</output></div><input id="ctlIso" type="range" min="0" max="6" step="1" value="3"></div>
            <div class="ctl"><div class="ctl__row"><label for="ctlSh">셔터</label><output id="outSh" for="ctlSh">1/48</output></div><input id="ctlSh" type="range" min="0" max="7" step="1" value="2"></div>
            <div class="seg">
              <button class="btn btn--small" id="btnFalse" type="button" aria-pressed="false">폴스컬러</button>
              <button class="btn btn--small" id="btnReset" type="button">기준값으로</button>
            </div>
            <dl class="readout" id="expReadout" aria-live="polite"></dl>
            <ul class="legend" id="falseLegend" aria-label="폴스컬러 범례"></ul>
            <p class="note" id="expNote"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="doc" data-doc="log"></div>

    <!-- 화이트밸런스 -->
    <div class="sub" id="wb" data-scene="프로덕션, 화이트밸런스">
      <div class="container">
        <div class="head" id="wbHead"></div>
        <div class="demo">
          <figure class="screen" style="margin:0">
            <span class="screen__tag" id="wbTag">5600K</span>
            <canvas id="wbCanvas" width="320" height="180" role="img" aria-label="켈빈 슬라이더에 따라 색온도가 바뀌는 색 차트. 흰 카드, 회색 카드, 색 블록, 피부색 패치."></canvas>
          </figure>
          <div class="controls">
            <div class="ctl"><div class="ctl__row"><label for="kelvin">카메라 화이트밸런스 설정</label><output id="outK" for="kelvin">5600K</output></div><input id="kelvin" type="range" min="2800" max="7000" step="100" value="5600"></div>
            <div class="ctl"><div class="ctl__row"><span id="lightLabel">현장 조명</span></div>
              <div class="seg" id="lightSeg" role="group" aria-labelledby="lightLabel"></div>
            </div>
            <dl class="readout" id="wbReadout" aria-live="polite"></dl>
            <p class="note" id="wbNote"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="doc" data-doc="wbGuide"></div>
    <div class="doc" data-doc="light"></div>
    <div class="doc" data-doc="sound"></div>
    <div class="doc" data-doc="gear"></div>
    <div class="doc" data-doc="onset"></div>
    <div class="doc" data-doc="framing"></div>

    <!-- 연출 체크리스트 -->
    <div class="well grained sub" id="directing" data-scene="프로덕션, 연출 체크">
      <div class="container">
        <div class="directing">
          <div class="directing__side">
            <div class="head" id="dirHead" style="display:grid;grid-template-columns:1fr;margin:0"></div>
            <div class="counter figure" aria-hidden="true"><span id="dirCount">0</span><small id="dirTotal">/ 7</small></div>
          </div>
          <ol class="checks" id="dirChecks"></ol>
        </div>
      </div>
    </div>
  </section>

  <!-- 03 포스트 프로덕션 -->
  <section class="offset scene" id="post" data-scene="포스트 프로덕션" aria-labelledby="postTitle">
    <div class="chapter" data-chapter="post"><div class="chapter__stage"><div class="chapter__inner"></div></div></div>
    <div class="container block">
      <div class="head" id="postHead"></div>
      <div class="vt" id="postSteps"><div class="vt__line" aria-hidden="true"><i id="vtFill"></i></div></div>
      <div class="know" id="postKnow"></div>
    </div>
  </section>

  <!-- 용어 정리 -->
  <div class="offset doc" data-doc="glossary"></div>

  <!-- 마무리 -->
  <section class="offset block" id="outro" data-scene="마무리" aria-labelledby="outroTitle">
    <div class="container">
      <h2 class="visually-hidden" id="outroTitle">마무리</h2>
      <div class="outro" id="outroBox"></div>
    </div>
  </section>

  <footer class="offset foot">
    <div class="container" style="display:grid;gap:var(--space-lg)">
      <div class="foot__row"><span class="foot__mark wordmark">영상놀</span><span id="footLinks"></span></div>
      <p class="note" id="footCredits">구도 예시 사진: <a href="https://commons.wikimedia.org/wiki/File:Zoutelande_(NL),_Strand,_Blick_auf_die_Nordsee_--_2022_--_4984.jpg">Dietmar Rabich</a> (CC BY-SA 4.0), <a href="https://commons.wikimedia.org/wiki/File:Santorin_(GR),_Exomytis,_Vlychada_Beach_--_2017_--_2999_(bw).jpg">Dietmar Rabich</a> (CC BY-SA 4.0), <a href="https://commons.wikimedia.org/wiki/File:Tilted_photo_-_example.jpg">W.carter</a> (CC BY-SA 4.0). 모두 Wikimedia Commons.</p>
    </div>
  </footer>
</main>

<noscript><p class="note" style="position:fixed;inset:auto 0 0 0;background:var(--color-accent);color:var(--color-accent-ink);padding:var(--space-sm);text-align:center;z-index:var(--z-toast)">일부 인터랙션에는 JavaScript가 필요합니다.</p></noscript>

<!-- 구도 연습 도식: 구도 문서 섹션에 삽입됩니다 -->
<template id="tpl-framing">
  <div class="frame-lab" data-reveal>
    <svg class="frame-svg" viewBox="0 0 480 270" role="img" aria-label="구도 개념 도식. 삼분할선, 헤드룸, 룩룸, 수평, 안전영역을 켜고 끌 수 있다.">
      <defs><marker id="fs-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="fs-arrowhead"/></marker></defs>
      <rect class="fs-bg" width="480" height="270"/>
      <g data-l="safe" hidden><rect class="fs-dash" x="24" y="13.5" width="432" height="243"/><text class="fs-t" x="32" y="30">안전영역</text></g>
      <g data-l="thirds"><line class="fs-line" x1="160" y1="0" x2="160" y2="270"/><line class="fs-line" x1="320" y1="0" x2="320" y2="270"/><line class="fs-line" x1="0" y1="90" x2="480" y2="90"/><line class="fs-line" x1="0" y1="180" x2="480" y2="180"/><circle class="fs-dot" cx="160" cy="90" r="4"/><circle class="fs-dot" cx="320" cy="90" r="4"/><circle class="fs-dot" cx="160" cy="180" r="4"/><circle class="fs-dot" cx="320" cy="180" r="4"/></g>
      <g class="fs-subject"><rect x="116" y="128" width="88" height="142" rx="6"/><rect x="152" y="118" width="16" height="14"/><circle cx="160" cy="92" r="28"/><circle class="fs-eye" cx="171" cy="90" r="2.5"/><path d="M186 96 L194 102 L186 104" class="fs-nose"/></g>
      <g data-l="headroom"><line class="fs-note-line" x1="60" y1="0" x2="60" y2="64"/><line class="fs-note-line" x1="50" y1="0" x2="70" y2="0"/><line class="fs-note-line" x1="50" y1="64" x2="70" y2="64"/><text class="fs-t" x="74" y="38">헤드룸</text></g>
      <g data-l="lookroom"><line class="fs-note-line" x1="204" y1="96" x2="464" y2="96" marker-end="url(#fs-arrow)"/><text class="fs-t" x="330" y="84">룩룸</text></g>
      <g data-l="horizon" hidden><line class="fs-good" x1="0" y1="216" x2="480" y2="216"/><text class="fs-t" x="8" y="210">수평이 맞은 선</text><line class="fs-bad" x1="0" y1="198" x2="480" y2="236"/><text class="fs-t" x="300" y="258">기울어진 선</text></g>
    </svg>
    <div class="seg" role="group" aria-label="보여 줄 구도 가이드">
      <button class="btn btn--small" type="button" data-layer="thirds" aria-pressed="true">삼분할</button>
      <button class="btn btn--small" type="button" data-layer="headroom" aria-pressed="true">헤드룸</button>
      <button class="btn btn--small" type="button" data-layer="lookroom" aria-pressed="true">룩룸</button>
      <button class="btn btn--small" type="button" data-layer="horizon" aria-pressed="false">수평</button>
      <button class="btn btn--small" type="button" data-layer="safe" aria-pressed="false">안전영역</button>
    </div>
  </div>
</template>

<!-- 사진 슬롯: 사진이 로드되지 않으면 이미지를 치우고, 슬롯 교체 함수를 제공 -->
<script>window.hallmarkSlots = (m) => { for (const [k, v] of Object.entries(m)) { const s = document.querySelector(`[data-slot="${k}"]`); if (!s) continue; const im = new Image(); im.src = typeof v === 'string' ? v : v.src; im.alt = (typeof v === 'object' && v.alt) || s.dataset.alt || ''; s.querySelectorAll(':scope > img').forEach((o) => o.remove()); s.prepend(im); } };
document.querySelectorAll('[data-slot] img').forEach((i) => { if (i.complete && !i.naturalWidth) i.remove(); else i.addEventListener('error', () => i.remove(), { once: true }); });</script>

<!-- 라이브러리(CDN): GSAP, ScrollTrigger, Lenis -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>

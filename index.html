<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOUNGSANGNOL — 촬영 노하우 &amp; 프로세스</title>
<meta name="description" content="프리 프로덕션, 프로덕션, 포스트 프로덕션. 촬영감독 겸 연출자의 촬영 노하우와 현장 프로세스를 스크롤로 읽는 교육형 사이트.">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:title" content="YOUNGSANGNOL — 촬영 노하우 & 프로세스">
<meta property="og:description" content="찍기 전에, 찍는 동안, 찍고 난 뒤까지.">

<!-- JS가 켜져 있을 때만 등장 효과용 숨김 상태를 적용 -->
<script>document.documentElement.classList.add('js');</script>

<!-- 폰트: Anton(제목) / JetBrains Mono(라벨) / Pretendard(본문) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e8a33d'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#intro">본문으로 건너뛰기</a>

<!-- 화면 전체 장식 -->
<div class="grain" aria-hidden="true"></div>
<div class="gridlines" aria-hidden="true"></div>

<!-- 상단 진행바 + 현재 위치 타임코드 -->
<div class="hud" aria-hidden="true">
  <div class="hud__bar"><i id="progress"></i></div>
  <div class="hud__tc"><span class="rec"></span><span id="hudScene">SCENE 00 / OPEN</span><b id="hudTc">00:00:00:00</b></div>
</div>

<!-- 목차: 데스크톱=좌측 고정, 모바일=상단 가로 바 (내용은 script.js의 CONTENT.toc) -->
<nav class="toc" id="toc" aria-label="목차">
  <a class="toc__brand" href="#hero">YOUNGSANGNOL</a>
  <ol id="tocList"></ol>
  <p class="toc__foot" id="tocFoot"></p>
</nav>

<main id="main">

  <!-- ===== 히어로 ===== -->
  <header class="hero" id="hero" data-scene="SCENE 00 / OPEN">
    <div class="hero__bg"><div data-ph="hero"></div></div>
    <div class="hero__shade" id="heroShade"></div>
    <div class="hero__vig"></div>
    <div class="hero__inner">
      <p class="hero__copy" id="heroCopy"></p>
      <h1 class="hero__title" id="heroTitle"></h1>
      <p class="hero__sub" id="heroSub"></p>
    </div>
    <div class="hero__scroll" aria-hidden="true"><span>SCROLL</span><i></i></div>
  </header>

  <!-- ===== 소개 ===== -->
  <section class="offset pad block perf" id="intro" data-scene="INTRO" aria-labelledby="introTitle">
    <h2 class="sr-only" id="introTitle">소개</h2>
    <div class="intro">
      <div class="intro__lines" id="introLines"></div>
      <div data-ph="portrait" data-reveal></div>
    </div>
  </section>

  <!-- ===== SCENE 01 / PRE ===== -->
  <section class="offset scene perf" id="pre" data-scene="SCENE 01 / PRE" aria-labelledby="preTitle">
    <div class="chapter" data-chapter="pre">
      <div class="chapter__stage"><div class="chapter__inner"></div></div>
    </div>
    <div class="pad block">
      <div class="head" id="preHead"></div>
      <div class="cards" id="preCards"></div>
      <div style="margin-top: var(--s5)" data-ph="location" data-reveal></div>
    </div>
  </section>

  <!-- ===== SCENE 02 / PROD ===== -->
  <section class="offset scene perf" id="prod" data-scene="SCENE 02 / PROD" aria-labelledby="prodTitle">
    <div class="chapter" data-chapter="prod">
      <div class="chapter__stage"><div class="chapter__inner"></div></div>
    </div>

    <div class="pad block" style="padding-bottom: var(--s5)">
      <div class="head" id="prodHead"></div>
    </div>

    <!-- 현장 하루 타임라인: 스크롤하면 가로로 흘러감 (pin) -->
    <div class="hscroll" id="timeline" data-scene="SCENE 02 / PROD · DAY" tabindex="-1">
      <div class="hscroll__wrap">
        <div class="hscroll__head pad" id="dayHead"></div>
        <div class="hscroll__track" id="dayTrack" role="list"></div>
      </div>
    </div>

    <!-- 노출 -->
    <div class="pad sub" id="exposure" data-scene="SCENE 02 / PROD · EXPOSURE">
      <div class="sub__head" id="expHead"></div>
      <div class="demo">
        <div class="scopes">
          <div class="screen">
            <span class="screen__tag" id="expTag">NORMAL</span>
            <canvas id="expCanvas" width="320" height="180" role="img" aria-label="노출 슬라이더에 따라 밝기가 바뀌는 샘플 장면. 창가에 앉은 인물."></canvas>
          </div>
          <div class="wave">
            <span class="wave__tag">WAVEFORM</span>
            <canvas id="waveCanvas" width="320" height="150" role="img" aria-label="현재 샘플 장면의 웨이브폼 그래프"></canvas>
          </div>
        </div>
        <div class="controls">
          <div class="ctl"><div class="ctl__row"><label for="ctlAp">조리개 APERTURE</label><output id="outAp" for="ctlAp">f/2.8</output></div><input id="ctlAp" type="range" min="0" max="7" step="1" value="2"></div>
          <div class="ctl"><div class="ctl__row"><label for="ctlIso">ISO</label><output id="outIso" for="ctlIso">800</output></div><input id="ctlIso" type="range" min="0" max="6" step="1" value="3"></div>
          <div class="ctl"><div class="ctl__row"><label for="ctlSh">셔터 SHUTTER</label><output id="outSh" for="ctlSh">1/48</output></div><input id="ctlSh" type="range" min="0" max="7" step="1" value="2"></div>
          <div class="seg">
            <button class="btn btn--sm" id="btnFalse" type="button" aria-pressed="false">폴스컬러 FALSE COLOR</button>
            <button class="btn btn--sm" id="btnReset" type="button">기준값으로 RESET</button>
          </div>
          <div class="readout" id="expReadout" aria-live="polite"></div>
          <div class="legend" id="falseLegend" aria-hidden="true"></div>
          <p class="lead" id="expNote" style="font-size:15px"></p>
        </div>
      </div>
    </div>

    <!-- 화이트밸런스 -->
    <div class="pad sub" id="wb" data-scene="SCENE 02 / PROD · WB">
      <div class="sub__head" id="wbHead"></div>
      <div class="demo">
        <div class="screen">
          <span class="screen__tag" id="wbTag">5600K</span>
          <canvas id="wbCanvas" width="320" height="180" role="img" aria-label="켈빈 슬라이더에 따라 색온도가 바뀌는 샘플 장면. 흰 카드와 색 블록들."></canvas>
        </div>
        <div class="controls">
          <div class="ctl"><div class="ctl__row"><label for="kelvin">카메라 WB 설정 (K)</label><output id="outK" for="kelvin">5600K</output></div><input id="kelvin" type="range" min="2800" max="7000" step="100" value="5600"></div>
          <div class="ctl"><div class="ctl__row"><label for="lightSel">현장 조명</label></div>
            <div class="seg" id="lightSeg" role="group" aria-label="현장 조명 선택"></div>
          </div>
          <div class="readout" id="wbReadout" aria-live="polite"></div>
          <p class="lead" id="wbNote" style="font-size:15px"></p>
        </div>
      </div>
    </div>

    <!-- 연출 체크리스트 -->
    <div class="pad sub" id="directing" data-scene="SCENE 02 / PROD · DIRECTING" style="padding-bottom: var(--s6)">
      <div class="directing">
        <div class="directing__side">
          <div class="sub__head" id="dirHead" style="margin:0"></div>
          <div class="counter" aria-hidden="true"><span id="dirCount">0</span><small id="dirTotal">/ 7</small></div>
          <div data-ph="set" data-reveal></div>
        </div>
        <ul class="checks" id="dirChecks"></ul>
      </div>
    </div>
  </section>

  <!-- ===== SCENE 03 / POST ===== -->
  <section class="offset scene perf" id="post" data-scene="SCENE 03 / POST" aria-labelledby="postTitle">
    <div class="chapter" data-chapter="post">
      <div class="chapter__stage"><div class="chapter__inner"></div></div>
    </div>
    <div class="pad block">
      <div class="head" id="postHead"></div>
      <div class="vt" id="postSteps"><div class="vt__line"><i id="vtFill"></i></div></div>
      <div class="know" id="postKnow"></div>
      <div style="margin-top: var(--s5)" data-ph="edit" data-reveal></div>
    </div>
  </section>

  <!-- ===== 마무리 ===== -->
  <section class="offset pad block perf" id="outro" data-scene="END" aria-labelledby="outroTitle">
    <h2 class="sr-only" id="outroTitle">마무리</h2>
    <div class="outro" id="outroBox"></div>
  </section>

  <footer class="offset foot" id="foot"></footer>
</main>

<noscript><p style="position:fixed;bottom:0;left:0;right:0;background:#e8a33d;color:#000;padding:12px;text-align:center;z-index:300">이 사이트는 JavaScript가 필요합니다.</p></noscript>

<!-- 라이브러리 (CDN): GSAP, ScrollTrigger, Lenis -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
